<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 450px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: #f8f9fa;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }
    
    .header h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 16px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .section h3 {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    button {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn-secondary {
      background: #e5e7eb;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #d1d5db;
    }
    
    .btn-block {
      grid-column: 1 / -1;
    }
    
    .contract-list {
      max-height: 250px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }
    
    .contract-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .contract-item:last-child {
      border-bottom: none;
    }
    
    .contract-info {
      flex: 1;
    }
    
    .contract-symbol {
      font-weight: 600;
      color: #667eea;
    }
    
    .contract-price {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    
    .contract-delete {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }
    
    .contract-delete:hover {
      background: #fecaca;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .stat-card {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      text-align: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
      text-align: center;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    .status.success {
      background: #d1fae5;
      color: #047857;
    }
    
    .status.error {
      background: #fee2e2;
      color: #dc2626;
    }
    
    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .empty-state {
      text-align: center;
      padding: 20px 12px;
      color: #999;
      font-size: 13px;
    }
    
    .footer {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>📊 SoFi Extractor</h2>
    <p>Extract options data automatically</p>
  </div>
  
  <div class="content">
    <div id="status" class="status"></div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="contractCount">0</div>
        <div class="stat-label">Contracts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lastCaptured">-</div>
        <div class="stat-label">Last</div>
      </div>
    </div>
    
    <div class="section">
      <h3>📋 Captured Contracts</h3>
      <div class="contract-list" id="contractList">
        <div class="empty-state">No contracts captured yet</div>
      </div>
    </div>
    
    <div class="section">
      <h3>Actions</h3>
      <div class="buttons">
        <button class="btn-primary btn-block" id="exportBtn">📥 Export CSV</button>
        <button class="btn-primary btn-block" id="syncBtn">🔄 Sync to App</button>
        <button class="btn-secondary btn-block" id="clearBtn">🗑️ Clear All</button>
      </div>
    </div>
  </div>
  
  <div class="footer">
    Click "Capture" button on SoFi to extract options data
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
